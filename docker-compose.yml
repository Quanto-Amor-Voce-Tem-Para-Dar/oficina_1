# Banco de dados para desenvolvimento local:  docker compose up -d
# (A configuração de produção na Oracle Cloud ainda será montada.)
services:
  mysql:
    image: mysql:8.4
    container_name: quanto-amor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quanto_amor
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql

volumes:
  mysql_dados:
